[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "condense-calc"
version = "0.2.0"
description = "condense-seq raw reads to condensability tables, with QC"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "pysam", "sortedcontainers", "matplotlib", "pyyaml"]

[project.scripts]
condense-calc = "condense_calc.cli:main"
condense = "condense_calc.cli:main"

[tool.setuptools]
packages = ["condense_calc"]

[tool.setuptools.package-data]
condense_calc = ["workflow/Snakefile", "templates/*", "get_reference.sh"]
