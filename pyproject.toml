[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudpoint"
version = "0.2.0"
description = "condense-seq raw reads to condensability tables, with QC"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "pysam", "sortedcontainers", "matplotlib", "pyyaml"]

[project.scripts]
cloudpoint = "cloudpoint.cli:main"
cloud = "cloudpoint.cli:main"

[tool.setuptools]
packages = ["cloudpoint"]

[tool.setuptools.package-data]
cloudpoint = ["workflow/Snakefile", "templates/*", "get_reference.sh"]
