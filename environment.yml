# conda env create -f environment.yml   (also installs condense-calc itself from this folder)
name: condense-calc
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - numpy=2.1
  - pandas=2.2
  - scipy=1.14
  - pysam=0.22
  - sortedcontainers=2.4
  - matplotlib-base=3.9
  - pyyaml
  - bowtie2=2.5.5             # exact: versions can differ by a read in a few bins (2.4.1 for --park: settings)
  - samtools=1.21
  - aria2                 # get_reference.sh: 16 connections (encode-public gives ~0.35 MB/s per connection)
  - snakemake=8
  - snakemake-executor-plugin-slurm
  - pytest
  - pip
  - pip:
      - -e .
