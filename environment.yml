# mamba env create -f environment.yml && mamba activate condseq && pip install -e .
name: condseq
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - numpy=2.1
  - pandas=2.2
  - scipy=1.14
  - pysam=0.22
  - sortedcontainers=2.4
  - matplotlib-base=3.9
  - pyyaml
  - bowtie2=2.5
  - samtools=1.21
  - snakemake=8
  - snakemake-executor-plugin-slurm
  - pytest
  - pip
