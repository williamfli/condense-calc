# Env for condense-seq-pipeline (raw reads -> condensability tables, Python 3 port of Park 2025).
# Build: sbatch slurm/00_make_env.sbatch  (from condense-seq-pipeline/)
name: condseq
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - numpy=2.1
  - pandas=2.2
  - scipy=1.14
  - pysam=0.22
  - sortedcontainers=2.4
  - bowtie2=2.5
  - samtools=1.21
  - snakemake=8
  - snakemake-executor-plugin-slurm
  - pytest
